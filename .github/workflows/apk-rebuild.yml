name: APK 重打包（壳地址迁移 Cloudflare）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 下载旧壳 APK（v1.0）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0 -p kaoyan-reading.apk -D apkbase

      - name: 下载 apktool 与签名器
        run: |
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          curl -sL -o uber.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          ls -la apktool.jar uber.jar

      - name: 反编译（仅 dex，保留原 manifest/resources）
        run: java -jar apktool.jar d -f --no-res -o dec apkbase/kaoyan-reading.apk

      - name: 替换壳地址 workbuddy → Cloudflare Pages
        run: |
          echo "替换前引用数："; grep -rl "kaoyan-reading-65228.app.workbuddy.host" dec | wc -l
          grep -rl "kaoyan-reading-65228.app.workbuddy.host" dec | xargs sed -i 's|kaoyan-reading-65228.app.workbuddy.host|yantu-reading.pages.dev|g'
          echo "替换后残留："; grep -rl "workbuddy.host" dec | wc -l

      - name: 回编译
        run: java -jar apktool.jar b -o unsigned.apk dec

      - name: 对齐 + 签名（新密钥，需卸载旧版后安装）
        run: |
          keytool -genkeypair -v -keystore ks.keystore -alias kaoyan \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass kaoyan2026 -keypass kaoyan2026 \
            -dname "CN=Yantu Reading, OU=shell, O=cxjcom"
          java -jar uber.jar -a unsigned.apk --ks ks.keystore --ksAlias kaoyan --ksKeyPass kaoyan2026 --ksPass kaoyan2026 --out signed
          ls -la signed/

      - name: 发布 v1.1 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls signed/*.apk | head -1)
          gh release create v1.1 "$APK#研途阅读 Android 安装包" \
            --title "研途阅读 Android 安装包 v1.1" \
            --notes "壳地址已从 workbuddy.host 迁移至 yantu-reading.pages.dev（Cloudflare）。
          - 壳内网页内容自动跟随线上最新版（当前 v1.9.0：三墨版画皮肤 + 背景渲染动画 + AI 兜底修复 + 内容量上调）
          - 签名密钥已更换：需先卸载旧版 APK 再安装本包
          - 推荐优先使用网页版 PWA 安装（更新更及时）" \
            --latest
